[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "divalia"
version = "2.0.0"
description = "Standalone, optional module development and deployment tool for Angerona Security Suite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Divalia contributors"}]
dependencies = ["defusedxml>=0.7.1,<1", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1,<2", "Pillow>=12,<13"]

[project.scripts]
divalia = "divalia.cli:main"

[project.urls]
Repository = "https://github.com/Ag3nt47/Divalia"
Issues = "https://github.com/Ag3nt47/Divalia/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
divalia = ["default_config.toml", "harness/Dockerfile"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
